<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kratto's Barbería | Reservá tu turno</title>

  <meta name="theme-color" content="#111111">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 35px 20px 25px;
      border-bottom: 1px solid #333333;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 12px;
      color: #b9b9b9;
      font-size: 13px;
      letter-spacing: 3px;
    }

    main {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 28px 20px 45px;
    }

    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 14px;
      margin: 20px 0 9px;
      color: #e5e5e5;
    }

    .services {
      display: grid;
      gap: 12px;
    }

    .service {
      width: 100%;
      padding: 18px;
      background: #1b1b1b;
      color: #ffffff;
      border: 1px solid #444444;
      border-radius: 8px;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
    }

    .service.selected {
      border: 1px solid #d2b078;
      background: #292319;
    }

    input,
    select {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 7px;
      border: 1px solid #444444;
      background: #1b1b1b;
      color: #ffffff;
      font-size: 16px;
    }

    input:focus,
    select:focus {
      outline: 1px solid #d2b078;
    }

    .duration {
      color: #b9b9b9;
      font-size: 12px;
      margin-top: 8px;
    }

    .reserve {
      display: block;
      width: 100%;
      margin-top: 28px;
      padding: 17px;
      border: none;
      border-radius: 7px;
      background: #d2b078;
      color: #111111;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .reserve:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .notice {
      margin-top: 18px;
      padding: 14px;
      border-radius: 7px;
      background: #222222;
      color: #eeeeee;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #333333;
      color: #888888;
      font-size: 12px;
    }

    @media (max-width: 360px) {
      .logo {
        font-size: 23px;
      }

      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">KRATTOS BARBERÍA</div>
    <div class="subtitle">MEJORÁ TU IMAGEN</div>
  </header>

  <main>
    <h1>RESERVÁ TU TURNO</h1>

    <form id="bookingForm">

      <label>ELIGE TU SERVICIO</label>

      <div class="services">

        <button
          type="button"
          class="service"
          data-service="CORTE">
          CORTE
        </button>

        <button
          type="button"
          class="service"
          data-service="SERVICIO DE BARBA">
          SERVICIO DE BARBA
        </button>

        <button
          type="button"
          class="service"
          data-service="CORTE + BARBA">
          CORTE + BARBA
        </button>

      </div>

      <label for="fecha">Elegí el día</label>

      <input
        type="date"
        id="fecha"
        required
      >

      <label for="hora">Elegí el horario</label>

      <select id="hora" required>
        <option value="">
          Seleccioná una fecha primero
        </option>
      </select>

      <p class="duration">
        Todos los servicios tienen una duración de 30 minutos.
      </p>

      <label for="nombre">Tu nombre</label>

      <input
        type="text"
        id="nombre"
        placeholder="Ingresá tu nombre"
        autocomplete="name"
        required
      >

      <label for="telefono">Tu teléfono</label>

      <input
        type="tel"
        id="telefono"
        placeholder="Ingresá tu número"
        autocomplete="tel"
        required
      >

      <button
        type="submit"
        class="reserve"
        id="reserveButton">
        RESERVAR TURNO
      </button>

      <div
        class="notice"
        id="notice"
        role="status">
      </div>

    </form>
  </main>

  <footer>
    KRATTOS BARBERÍA · MEJORÁ TU IMAGEN
  </footer>

  <script>

    const services =
      document.querySelectorAll(".service");

    const form =
      document.getElementById("bookingForm");

    const dateInput =
      document.getElementById("fecha");

    const timeSelect =
      document.getElementById("hora");

    const notice =
      document.getElementById("notice");

    const reserveButton =
      document.getElementById("reserveButton");


    let selectedService = "";


    /*
      DIRECCIÓN DEL WORKER
    */

    const API_URL =
      "https://krattos-turnos-api.tinchogarra80.workers.dev";


    /*
      FECHA ACTUAL
    */

    function getLocalDate() {

      const now = new Date();

      const year =
        now.getFullYear();

      const month =
        String(now.getMonth() + 1)
          .padStart(2, "0");

      const day =
        String(now.getDate())
          .padStart(2, "0");

      return `${year}-${month}-${day}`;
    }


    dateInput.min =
      getLocalDate();


    /*
      SELECCIÓN DEL SERVICIO
    */

    services.forEach(button => {

      button.addEventListener(
        "click",
        () => {

          services.forEach(item => {

            item.classList.remove(
              "selected"
            );

          });

          button.classList.add(
            "selected"
          );

          selectedService =
            button.dataset.service;

          hideNotice();

        }
      );

    });


    /*
      HORARIOS DE KRATTOS
    */

    function getBusinessHours(
      dateString
    ) {

      const date =
        new Date(
          dateString +
          "T12:00:00"
        );

      const day =
        date.getDay();


      // Domingo cerrado

      if (day === 0) {
        return [];
      }


      // Lunes

      if (day === 1) {

        return [
          ["16:30", "20:30"]
        ];

      }


      // Martes a viernes

      if (
        day >= 2 &&
        day <= 5
      ) {

        return [
          ["10:00", "13:00"],
          ["16:30", "20:30"]
        ];

      }


      // Sábado

      if (day === 6) {

        return [
          ["10:00", "13:30"],
          ["17:30", "20:30"]
        ];

      }


      return [];
    }


    /*
      CONVERTIR HORA A MINUTOS
    */

    function toMinutes(time) {

      const [
        hours,
        minutes
      ] =
        time
          .split(":")
          .map(Number);

      return (
        hours * 60 +
        minutes
      );
    }


    /*
      CONVERTIR MINUTOS A HORA
    */

    function toTime(minutes) {

      const hours =
        String(
          Math.floor(
            minutes / 60
          )
        ).padStart(2, "0");

      const mins =
        String(
          minutes % 60
        ).padStart(2, "0");

      return `${hours}:${mins}`;
    }


    /*
      AGREGAR OPCIÓN AL SELECTOR
    */

    function addOption(
      value,
      text
    ) {

      const option =
        document.createElement(
          "option"
        );

      option.value = value;

      option.textContent = text;

      timeSelect.appendChild(
        option
      );
    }


    /*
      MENSAJES
    */

    function showNotice(
      message
    ) {

      notice.textContent =
        message;

      notice.style.display =
        "block";
    }


    function hideNotice() {

      notice.style.display =
        "none";
    }


    /*
      CARGAR HORARIOS
    */

    async function loadAvailableHours() {

      const selectedDate =
        dateInput.value;


      timeSelect.innerHTML =
        "";


      if (!selectedDate) {

        addOption(
          "",
          "Seleccioná una fecha primero"
        );

        return;
      }


      timeSelect.disabled =
        true;


      addOption(
        "",
        "Cargando horarios..."
      );


      try {

        const response =
          await fetch(
            `${API_URL}/api/turnos?fecha=${encodeURIComponent(selectedDate)}`
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "No se pudieron cargar los horarios."
          );

        }


        timeSelect.innerHTML =
          "";


        const horarios =
          data.horarios || [];


        if (
          horarios.length === 0
        ) {

          addOption(
            "",
            "No hay horarios disponibles"
          );

          return;
        }


        addOption(
          "",
          "Seleccioná un horario"
        );


        horarios.forEach(
          hora => {

            addOption(
              hora,
              hora
            );

          }
        );


      } catch (error) {

        console.error(error);


        timeSelect.innerHTML =
          "";


        addOption(
          "",
          "Error al cargar horarios"
        );


      } finally {

        timeSelect.disabled =
          false;

      }

    }


    /*
      CAMBIO DE FECHA
    */

    dateInput.addEventListener(
      "change",
      () => {

        loadAvailableHours();

        hideNotice();

      }
    );


    /*
      RESERVAR TURNO
    */

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        if (!selectedService) {

          showNotice(
            "Primero elegí uno de los tres servicios."
          );

          return;
        }


        if (
          !dateInput.value ||
          !timeSelect.value
        ) {

          showNotice(
            "Elegí una fecha y un horario para continuar."
          );

          return;
        }


        const nombre =
          document
            .getElementById(
              "nombre"
            )
            .value
            .trim();


        const telefono =
          document
            .getElementById(
              "telefono"
            )
            .value
            .trim();


        if (
          !nombre ||
          !telefono
        ) {

          showNotice(
            "Completá tu nombre y teléfono."
          );

          return;
        }


        reserveButton.disabled =
          true;


        reserveButton.textContent =
          "RESERVANDO...";


        try {

          const response =
            await fetch(
              `${API_URL}/api/turnos`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    fecha:
                      dateInput.value,

                    hora:
                      timeSelect.value,

                    servicio:
                      selectedService,

                    nombre:
                      nombre,

                    telefono:
                      telefono
                  })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            showNotice(
              data.error ||
              "No se pudo reservar el turno."
            );

            return;
          }


          showNotice(
            `¡Turno reservado correctamente! ` +
            `${dateInput.value} a ${timeSelect.value}.`
          );


          form.reset();


          services.forEach(
            item => {

              item.classList.remove(
                "selected"
              );

            }
          );


          selectedService =
            "";


          timeSelect.innerHTML =
            "";


          addOption(
            "",
            "Seleccioná una fecha primero"
          );


        } catch (error) {

          console.error(error);


          showNotice(
            "No se pudo conectar con el sistema de turnos."
          );


        } finally {

          reserveButton.disabled =
            false;


          reserveButton.textContent =
            "RESERVAR TURNO";

        }

      }
    );

  </script>

</body>
</html>
